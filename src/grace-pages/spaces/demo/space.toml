# SPDX-License-Identifier: MIT
# The demo space (D82, D160): GraceUI's own test space, a lantern keeper's pages with invented names and our own words.
# It uses every setting type, tabs, an Advanced disclosure, state and stream topics, a locked setting, a setting waiting
# on a check, a later-version page and a destructive action, a table with row actions and a row secret, a form and a
# setting whose choices come from a topic (G34), sections with a chip, a live status and their own actions (G36), so the
# views, the page lint and the fake host are tested against it. Its fixtures are fixtures/demo/topics.json.
# tools/pages/build.py compiles it into grace-pages.

[space]
id = "demo"
name = "Demo space"
settings_schema = 1
commands = ["settings.set", "settings.reset", "lantern.trim", "lantern.clear_log", "keepers.dismiss", "keepers.ward",
            "keepers.hire", "keepers.dismiss_all", "oil.order"]

[[topic]]
id = "settings"
shape = "state"

[[topic]]
id = "lantern.status"
shape = "state"

[[topic]]
id = "lantern.keepers"
shape = "state"

[[topic]]
id = "lantern.oils"
shape = "state"

[[topic]]
id = "lantern.log"
shape = "stream"
ring = 200

[[topic]]
id = "lantern.journal"
shape = "stream"
ring = 500

[[category]]
id = "lanterns"
name = "Lanterns"
pages = ["demo.overview", "demo.behaviour", "demo.keepers"]

[[category]]
id = "records"
name = "Records"
pages = ["demo.log", "demo.festival"]

# ---- Settings: one of every type (§6.9).

[[setting]]
key = "lantern.enabled"
type = "bool"
default = true
label = "Lantern lit"
help = "Whether the north lantern burns at all."
synonyms = ["on", "off", "light"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.brightness"
type = "number"
default = 0.8
min = 0.0
max = 1.0
step = 0.05
label = "Brightness"
help = "How brightly the lantern burns, from a glimmer to its full flame."
synonyms = ["light", "glow", "flame"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.colour"
type = "choice"
default = "amber"
choices = [{ value = "amber", label = "Amber" }, { value = "white", label = "White" }, { value = "blue", label = "Blue" }]
label = "Flame colour"
help = "The colour of the flame behind the glass."
synonyms = ["color", "tint"]
home = "demo.behaviour"
effect = "next_moment"
availability = "live"

[[setting]]
key = "lantern.mode"
type = "tri_state"
default = "auto"
label = "Shutters"
help = "Open, closed, or left to the keeper's judgement."
synonyms = ["shutter", "cover"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.shield"
type = "tri_state"
third = "inherit"
default = "inherit"
label = "Wind shield"
help = "On, off, or as the lighthouse's own setting has it."
synonyms = ["wind", "shield", "glass"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.gap_s"
type = "duration_s"
default = 2.5
min = 0.5
max = 10.0
step = 0.5
unit = "s"
label = "Time between flickers"
help = "The shortest pause between two flickers of the flame."
synonyms = ["gap", "delay", "flicker"]
home = "demo.behaviour"
effect = "next_moment"
availability = "live"

[[setting]]
key = "lantern.wicks"
type = "integer"
default = 3
min = 1
max = 8
step = 1
label = "Wicks"
help = "How many wicks the lantern holds."
synonyms = ["wick", "candles"]
home = "demo.behaviour"
effect = "next_request"
availability = "live"

[[setting]]
key = "lantern.night_only"
type = "bool"
default = false
label = "Only at night"
help = "Lights the lantern only after dusk. It waits on the keeper's sundial."
synonyms = ["night", "dusk"]
home = "demo.behaviour"
effect = "now"
availability = "check:sundial"

[[setting]]
key = "lantern.keeper"
type = "text"
default = "The north keeper"
label = "Keeper's name"
help = "The name the log gives the keeper."
synonyms = ["name", "keeper"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.trim_key"
type = "key_name"
default = "F9"
label = "Trim the wick"
help = "The key that trims the wick at once."
synonyms = ["trim", "hotkey"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.oil_token"
type = "secret"
default = ""
label = "Oil merchant's token"
help = "The token the oil merchant asked for. It is never shown again once saved."
synonyms = ["token", "key", "merchant"]
home = "demo.behaviour"
effect = "next_request"
availability = "live"

[[setting]]
key = "lantern.festival"
type = "bool"
default = false
label = "Festival lights"
help = "Strings of small lights for the festival, in a later version."
synonyms = ["festival", "garland"]
home = "demo.festival"
effect = "now"
availability = "later"
locked = true

[[setting]]
key = "lantern.oil_kind"
type = "text"
choices_from = "lantern.oils"
default = "rapeseed"
label = "Oil"
help = "What the lantern burns, from the oils in the store."
synonyms = ["fuel", "oil"]
home = "demo.keepers"
effect = "next_moment"
availability = "live"

# ---- Pages.

[[page]]
id = "demo.overview"
category = "lanterns"
name = "Overview"
description = "The lantern at a glance: its flame, its oil and its last trim."
increment = "0.2"
related = ["demo.behaviour", "demo.log"]
help.purpose = "See how the north lantern is burning right now."
help.steps = ["Read the tiles: flame, oil and the time since the last trim.", "Trim the wick from the header when the flame gutters.", "Adjust its brightness here, or everything else on Behaviour."]

[[page.actions]]
id = "trim"
label = "Trim the wick"
command = "lantern.trim"
tone = "primary"

[[page.sections]]
id = "now"
title = "Now"
blocks = [{ kind = "component", component = "stat_tiles", topic = "lantern.status" }, { kind = "component", component = "computed_sentence", topic = "lantern.status" }, { kind = "shortcuts", keys = ["lantern.brightness"] }]

[[page]]
id = "demo.behaviour"
category = "lanterns"
name = "Behaviour"
description = "How the lantern burns, how often it flickers, and who keeps it."
increment = "0.2"
related = ["demo.overview", "demo.festival"]
help.purpose = "Set how the lantern burns and who keeps it."
help.steps = ["Choose the flame on the Light tab.", "Set its rhythm on the Timing tab; rare settings are under Advanced.", "Name the keeper and the trimming key on the Keeper tab."]

[[page.tabs]]
id = "light"
name = "Light"
sections = [{ id = "flame", title = "Flame", blocks = [{ kind = "settings", keys = ["lantern.enabled", "lantern.brightness", "lantern.colour", "lantern.mode", "lantern.shield"] }] }]

[[page.tabs]]
id = "timing"
name = "Timing"
sections = [{ id = "rhythm", title = "Rhythm", description = "How the flame moves.", blocks = [{ kind = "settings", keys = ["lantern.gap_s", "lantern.wicks"] }], advanced = [{ kind = "settings", keys = ["lantern.night_only"] }] }]

[[page.tabs]]
id = "keeper"
name = "Keeper"
sections = [{ id = "keeper", title = "Keeper", blocks = [{ kind = "settings", keys = ["lantern.keeper", "lantern.trim_key", "lantern.oil_token"] }] }]

[[page]]
id = "demo.log"
category = "records"
name = "Log"
description = "What the lantern did, as it happens, and the keeper's journal."
increment = "0.2"
related = ["demo.overview"]
help.purpose = "Follow the lantern's log as it is written, and read the keeper's journal."
help.steps = ["Watch new lines arrive at the top of the log.", "Read older entries in the journal below.", "Clear the log from the header; the journal stays."]

[[page.actions]]
id = "clear"
label = "Clear the log"
command = "lantern.clear_log"
tone = "destructive"
confirm = "The log's lines are removed. The journal is kept."

[[page.sections]]
id = "log"
title = "Log"
blocks = [{ kind = "component", component = "live_feed", topic = "lantern.log" }]

[[page.sections]]
id = "journal"
title = "Journal"
collapsed = true
blocks = [{ kind = "component", component = "log_tail", topic = "lantern.journal" }]

[[page]]
id = "demo.festival"
category = "records"
name = "Festival"
description = "Festival lights, in a later version."
tag = "later"
related = ["demo.behaviour"]
help.purpose = "A later version strings small lights about the lantern for the festival."
help.steps = ["Read what the later version adds.", "Until then, the lantern burns as Behaviour sets it.", "Its one setting stays off and locked here."]

[[page.sections]]
id = "festival"
title = "Festival"
blocks = [{ kind = "component", component = "statement", props = { text = "A later version strings small lights about the lantern for the festival. This version keeps the lantern alone." } }, { kind = "settings", keys = ["lantern.festival"] }]

[[page]]
id = "demo.keepers"
category = "lanterns"
name = "Keepers"
description = "Who keeps the lantern, their ward words, and the oil they burn."
increment = "0.2"
related = ["demo.behaviour", "demo.overview"]
help.purpose = "Look after the lantern's keepers and choose its oil."
help.steps = ["Read the roster: each keeper's post, and whether their ward word is set.", "Set a keeper's ward word on their row, or dismiss them; dismissing asks first.", "Hire a keeper with the form, and choose the oil from what the store holds."]

[[page.sections]]
id = "roster"
title = "Roster"
actions = [{ id = "dismiss_all", label = "Dismiss all", command = "keepers.dismiss_all", tone = "destructive", confirm = "Every keeper leaves the roster, with their ward words." }]
blocks = [{ kind = "component", component = "table", topic = "lantern.keepers", props = { empty = "No keeper yet: hire one below." }, row_actions = [{ id = "dismiss", label = "Dismiss", command = "keepers.dismiss", key = "id", tone = "destructive", confirm = "The keeper leaves the roster, with their ward word." }], row_secret = { column = "ward", command = "keepers.ward", key = "id" } }]

[[page.sections]]
id = "hire"
title = "Hire a keeper"
blocks = [{ kind = "form", command = "keepers.hire", fields = [{ id = "name", label = "Name", max = 32 }, { id = "post", label = "Post", max = 64 }], submit = "Hire" }]

[[page.sections]]
id = "oil"
title = "Oil"
chip = "store"
status = { topic = "lantern.oils", field = "stock" }
actions = [{ id = "order", label = "Order oil", command = "oil.order", tone = "secondary" }]
blocks = [{ kind = "settings", keys = ["lantern.oil_kind"] }]
