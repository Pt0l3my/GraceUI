# SPDX-License-Identifier: MIT
# The demo space (D82, D160): GraceUI's own test space, a lantern keeper's pages with invented names and our own words.
# It uses every setting type, tabs, an Advanced disclosure, state and stream topics, a locked setting, a setting waiting
# on a check, a later-version page and a destructive action, a table with row actions and a row secret, a form and a
# setting whose choices come from a topic (G34), sections with a chip, a live status and their own actions (G36), a
# page with a master list whose detail is a topic family (G38, D215), and an upload block for a roster file (G28, D226),
# so the views, the page lint and the fake host are
# tested against it. Its fixtures are fixtures/demo/topics.json.
# tools/pages/build.py compiles it into grace-pages.

[space]
id = "demo"
name = "Demo space"
settings_schema = 1
commands = ["settings.set", "settings.reset", "lantern.trim", "lantern.clear_log", "keepers.dismiss", "keepers.ward",
            "keepers.hire", "keepers.dismiss_all", "oil.order", "note.check", "note.save", "note.reset", "note.restore",
            "note.draft", "keepers.import", "report.part", "bell.hush"]
slow_commands = ["oil.order", "note.draft"]  # the harbour store's oil and a drafted note: within 90 s (D216)
file_commands = ["keepers.import"]  # a roster file, by the upload route from this PC alone (D226)
sensitive_commands = ["keepers.import"]
# The top bar's Quick switches (D252): the lantern on and its colour, as shortcuts to their homes; and the bell hushed
# for this session, the space's own switch, never a setting, its state on lantern.status.
quick = [{ key = "lantern.enabled" }, { key = "lantern.colour" },
         { id = "hush", label = "Hush the bell for this session", command = "bell.hush", state = { topic = "lantern.status", field = "hushed" }, home = "demo.overview" }]

[[topic]]
id = "settings"
shape = "state"

[[topic]]
id = "lantern.status"
shape = "state"

[[topic]]
id = "lantern.keepers"
shape = "state"

[[topic]]
id = "lantern.oils"
shape = "state"

[[topic]]
id = "lantern.lamps"
shape = "state"

[[topic]]
id = "lantern.lamp"
shape = "state"
family = true

[[topic]]
id = "lantern.note"
shape = "state"
family = true

[[topic]]
id = "lantern.guides"  # the handbook's list: each guide's id, title and headings (D251)
shape = "state"

[[topic]]
id = "lantern.guide"  # a guide's document (D251)
shape = "state"
family = true

[[topic]]
id = "lantern.report"  # the lamp report's preview (D251)
shape = "state"

[[topic]]
id = "lantern.log"
shape = "stream"
ring = 200

[[topic]]
id = "lantern.journal"
shape = "stream"
ring = 500

[[category]]
id = "lanterns"
name = "Lanterns"
pages = ["demo.overview", "demo.behaviour", "demo.keepers"]

[[category]]
id = "records"
name = "Records"
pages = ["demo.log", "demo.festival", "demo.lamps", "demo.handbook"]
foot = true  # at the rail's foot, under a rule (D248)

# ---- Settings: one of every type (§6.9).

[[setting]]
key = "lantern.enabled"
type = "bool"
default = true
label = "Lantern lit"
help = "Whether the north lantern burns at all."
synonyms = ["on", "off", "light"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.brightness"
type = "number"
default = 0.8
min = 0.0
max = 1.0
step = 0.05
label = "Brightness"
help = "How brightly the lantern burns, from a glimmer to its full flame."
synonyms = ["light", "glow", "flame"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.colour"
type = "choice"
default = "amber"
choices = [{ value = "amber", label = "Amber" }, { value = "white", label = "White" }, { value = "blue", label = "Blue" }]
label = "Flame colour"
help = "The colour of the flame behind the glass."
synonyms = ["color", "tint"]
home = "demo.behaviour"
effect = "next_moment"
availability = "live"

[[setting]]
key = "lantern.mode"
type = "tri_state"
default = "auto"
label = "Shutters"
help = "Open, closed, or left to the keeper's judgement."
synonyms = ["shutter", "cover"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.shield"
type = "tri_state"
third = "inherit"
default = "inherit"
label = "Wind shield"
help = "On, off, or as the lighthouse's own setting has it."
synonyms = ["wind", "shield", "glass"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.gap_s"
type = "duration_s"
default = 2.5
min = 0.5
max = 10.0
step = 0.5
unit = "s"
label = "Time between flickers"
help = "The shortest pause between two flickers of the flame."
synonyms = ["gap", "delay", "flicker"]
home = "demo.behaviour"
effect = "next_moment"
availability = "live"

[[setting]]
key = "lantern.wicks"
type = "integer"
default = 3
min = 1
max = 8
step = 1
label = "Wicks"
help = "How many wicks the lantern holds."
synonyms = ["wick", "candles"]
home = "demo.behaviour"
effect = "next_request"
availability = "live"

[[setting]]
key = "lantern.night_only"
type = "bool"
default = false
label = "Only at night"
help = "Lights the lantern only after dusk. It waits on the keeper's sundial."
synonyms = ["night", "dusk"]
home = "demo.behaviour"
effect = "now"
availability = "check:sundial"

[[setting]]
key = "lantern.keeper"
type = "text"
default = "The north keeper"
label = "Keeper's name"
help = "The name the log gives the keeper."
synonyms = ["name", "keeper"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.trim_key"
type = "key_name"
default = "F9"
label = "Trim the wick"
help = "The key that trims the wick at once."
synonyms = ["trim", "hotkey"]
home = "demo.behaviour"
effect = "now"
availability = "live"

[[setting]]
key = "lantern.oil_token"
type = "secret"
default = ""
label = "Oil merchant's token"
help = "The token the oil merchant asked for. It is never shown again once saved."
synonyms = ["token", "key", "merchant"]
home = "demo.behaviour"
effect = "next_request"
availability = "live"

[[setting]]
key = "lantern.festival"
type = "bool"
default = false
label = "Festival lights"
help = "Strings of small lights for the festival, in a later version."
synonyms = ["festival", "garland"]
home = "demo.festival"
effect = "now"
availability = "later"
locked = true

[[setting]]
key = "lantern.oil_kind"
type = "text"
choices_from = "lantern.oils"
default = "rapeseed"
label = "Oil"
help = "What the lantern burns, from the oils in the store."
synonyms = ["fuel", "oil"]
home = "demo.keepers"
effect = "next_moment"
availability = "live"

# ---- Pages.

[[page]]
id = "demo.overview"
live = true  # its topics move by themselves: Live updates holds them (D252)
category = "lanterns"
name = "Overview"
description = "The lantern at a glance: its flame, its oil and its last trim."
increment = "0.2"
related = ["demo.behaviour", "demo.log"]
help.purpose = "See how the north lantern is burning right now."
help.steps = ["Read the tiles: flame, oil and the time since the last trim.", "Trim the wick from the header when the flame gutters.", "Adjust its brightness here, or everything else on Behaviour."]

[[page.actions]]
id = "trim"
label = "Trim the wick"
command = "lantern.trim"
tone = "primary"

[[page.sections]]
id = "now"
title = "Now"
blocks = [{ kind = "component", component = "stat_tiles", topic = "lantern.status" }, { kind = "component", component = "computed_sentence", topic = "lantern.status" }, { kind = "shortcuts", keys = ["lantern.brightness"] }]

[[page]]
id = "demo.behaviour"
category = "lanterns"
name = "Behaviour"
description = "How the lantern burns, how often it flickers, and who keeps it."
increment = "0.2"
related = ["demo.overview", "demo.festival"]
help.purpose = "Set how the lantern burns and who keeps it."
help.steps = ["Choose the flame on the Light tab.", "Set its rhythm on the Timing tab; rare settings are under Advanced.", "Name the keeper and the trimming key on the Keeper tab."]

[[page.tabs]]
id = "light"
name = "Light"
sections = [{ id = "flame", title = "Flame", blocks = [{ kind = "settings", keys = ["lantern.enabled", "lantern.brightness", "lantern.colour", "lantern.mode", "lantern.shield"] }] }]

[[page.tabs]]
id = "timing"
name = "Timing"
sections = [{ id = "rhythm", title = "Rhythm", description = "How the flame moves.", blocks = [{ kind = "settings", keys = ["lantern.gap_s", "lantern.wicks"] }], advanced = [{ kind = "settings", keys = ["lantern.night_only"] }] }]

[[page.tabs]]
id = "keeper"
name = "Keeper"
sections = [{ id = "keeper", title = "Keeper", blocks = [{ kind = "settings", keys = ["lantern.keeper", "lantern.trim_key", "lantern.oil_token"] }] }]

[[page]]
id = "demo.log"
live = true  # its topics move by themselves: Live updates holds them (D252)
category = "records"
name = "Log"
description = "What the lantern did, as it happens, and the keeper's journal."
increment = "0.2"
related = ["demo.overview"]
help.purpose = "Follow the lantern's log as it is written, and read the keeper's journal."
help.steps = ["Watch new lines arrive at the top of the log.", "Read older entries in the journal below.", "Clear the log from the header; the journal stays."]

[[page.actions]]
id = "clear"
label = "Clear the log"
command = "lantern.clear_log"
tone = "destructive"
confirm = "The log's lines are removed. The journal is kept."

[[page.sections]]
id = "log"
title = "Log"
blocks = [{ kind = "component", component = "live_feed", topic = "lantern.log" }]

[[page.sections]]
id = "journal"
title = "Journal"
collapsed = true
blocks = [{ kind = "component", component = "log_tail", topic = "lantern.journal" }]

[[page.sections]]
id = "report"
title = "Lamp report"
description = "What a report to the harbour master would hold. Leave out the parts you would rather not send."
blocks = [{ kind = "component", component = "report_preview", topic = "lantern.report", command = "report.part" }]

[[page]]
id = "demo.festival"
category = "records"
name = "Festival"
description = "Festival lights, in a later version."
tag = "later"
related = ["demo.behaviour"]
help.purpose = "A later version strings small lights about the lantern for the festival."
help.steps = ["Read what the later version adds.", "Until then, the lantern burns as Behaviour sets it.", "Its one setting stays off and locked here."]

[[page.sections]]
id = "festival"
title = "Festival"
blocks = [{ kind = "component", component = "statement", props = { text = "A later version strings small lights about the lantern for the festival. This version keeps the lantern alone." } }, { kind = "settings", keys = ["lantern.festival"] }]

[[page]]
id = "demo.keepers"
category = "lanterns"
name = "Keepers"
description = "Who keeps the lantern, their ward words, and the oil they burn."
increment = "0.2"
related = ["demo.behaviour", "demo.overview"]
help.purpose = "Look after the lantern's keepers and choose its oil."
help.steps = ["Read the roster: each keeper's post, and whether their ward word is set.", "Set a keeper's ward word on their row, or dismiss them; dismissing asks first.", "Hire a keeper with the form, or bring several from a roster file in the browser view on this PC.", "Choose the oil from what the store holds."]

[[page.sections]]
id = "roster"
title = "Roster"
blocks = [{ kind = "component", component = "table", topic = "lantern.keepers", props = { empty = "No keeper yet: hire one below." }, row_actions = [{ id = "dismiss", label = "Dismiss", command = "keepers.dismiss", key = "id", tone = "destructive", confirm = "The keeper leaves the roster, with their ward word." }], row_secret = { column = "ward", command = "keepers.ward", key = "id" }, filter_bar = { filters = [{ column = "post", label = "Post" }], sort = [{ key = "kept_days", label = "Time kept", direction = "descending" }, { key = "name", label = "Name" }], search = { columns = ["name"], label = "Find a keeper" } } }]
actions = [{ id = "dismiss_all", label = "Dismiss all", command = "keepers.dismiss_all", tone = "destructive", confirm = "Every keeper leaves the roster, with their ward words." }]

[[page.sections]]
id = "hire"
title = "Hire a keeper"
blocks = [{ kind = "form", command = "keepers.hire", fields = [{ id = "name", label = "Name", max = 32 }, { id = "post", label = "Post", max = 64 }, { id = "notes", label = "Notes", max = 400, prose = true }], submit = "Hire" }]

[[page.sections]]
id = "oil"
title = "Oil"
blocks = [{ kind = "settings", keys = ["lantern.oil_kind"] }]
chip = "store"
status = { topic = "lantern.oils", field = "stock" }
actions = [{ id = "order", label = "Order oil", command = "oil.order", tone = "secondary" }]

[[page.sections]]
id = "roster_file"
title = "From a roster file"
description = "A harbour roster lists several keepers at once; each keeper it names joins the roster."
blocks = [{ kind = "upload", command = "keepers.import", submit = "Add a roster file", accept = ".toml, .txt" }]

[[page]]
id = "demo.lamps"
category = "records"
name = "Lamps"
description = "Every lamp on the harbour wall, and how each one burns."
increment = "0.2"
related = ["demo.overview", "demo.log"]
help.purpose = "Look over the harbour wall's lamps, one at a time."
help.steps = ["Choose a lamp in the list.", "Read how it burns on the Lamp tab, and its keeper's notes on the Notes tab.", "Write your own notes on a lamp on the Your notes tab: check them, then save."]
master = { topic = "lantern.lamps", key = "id", detail = "lantern.lamp", label = "Lamps", empty = "No lamp is lit on the wall yet.", none = "Choose a lamp to see how it burns.", filter_bar = { sort = [{ key = "along_m", label = "Along the wall" }, { key = "name", label = "Name" }], search = { columns = ["name", "place"], label = "Find a lamp" } } }

[[page.tabs]]
id = "lamp"
name = "Lamp"
sections = [{ id = "burning", title = "Burning", blocks = [{ kind = "component", component = "stat_tiles", topic = "lantern.lamp" }, { kind = "component", component = "key_value_list", topic = "lantern.lamp", props = { field = "facts" } }] }]

[[page.tabs]]
id = "notes"
name = "Notes"
sections = [{ id = "notes", title = "Keeper's notes", blocks = [{ kind = "component", component = "computed_sentence", topic = "lantern.lamp", props = { empty = "No note for this lamp yet." } }] }]

[[page.tabs]]
id = "yours"
name = "Your notes"
sections = [{ id = "your_notes", title = "Your notes", blocks = [{ kind = "editor", topic = "lantern.note", editor = { save = "note.save", check = "note.check", reset = "note.reset", restore = "note.restore", draft = "note.draft", notes_label = "Your rough notes", notes_max = 400 } }] }]

[[page]]
id = "demo.handbook"
category = "records"
name = "Handbook"
description = "The keeper's handbook: how to light, feed and keep the lamps."
increment = "0.2"
related = ["demo.lamps", "demo.log"]
help.purpose = "Read the keeper's handbook, one guide at a time."
help.steps = ["Choose a guide in the list, or find one by its title or a heading.", "Follow a link to another guide, or to one of its headings.", "Return to the list with Esc or the left arrow."]
master = { topic = "lantern.guides", key = "id", detail = "lantern.guide", label = "Guides", empty = "No guide is written yet.", none = "Choose a guide to read it.", filter_bar = { search = { columns = ["title", "headings"], label = "Find a guide" } } }

[[page.sections]]
id = "guide"
title = "Guide"
blocks = [{ kind = "document", topic = "lantern.guide" }]

