# SPDX-License-Identifier: MIT
# src/grace-protocol/protocol.toml: the bridge protocol's one schema (GraceUI DESIGN §6, D108, D159):
# the envelope, every message kind, the error codes, the limits, the settings description and the framework's own
# commands. tools/protocol/generate.py writes the C++ types and their checked decoders and encoders
# (src/grace-protocol/include/grace/protocol/messages.h, src/grace-protocol/messages.cpp) and the web app's TypeScript
# types (web/src/protocol.ts) from it; `--check` fails when an output drifts. A space's own topics and commands join this
# schema as their pages are built (§6.1); a topic's or a command's body is otherwise a JSON object, checked by its space.
#
# Field types: string (with max, bytes of UTF-8), id (1 to 64 of a-z, 0-9, '.', '_', '-' and '/'), u32, u64, f64, bool,
# json (any JSON value, at most max bytes when encoded), object (a JSON object, likewise), enum.<name>, type.<name>, and
# list.<type> with max items. `optional = true` lets a field be absent.

schema = 1
protocol = { major = 1, minor = 16 }  # 1.1 (D172): result.detail; a stream cleared by an empty batch past a gap.
                                     # 1.2 (G34): row actions, row secrets, form blocks, choices_from (D192 to D195).
                                     # 1.3 (G36): a section's chip, live status and actions (D202).
                                     # 1.4 (G37): a row action that captures a key or a pad chord first (D209)
                                     # 1.5 (G38): topic families, and a page's master list (D215)
                                     # 1.6 (G38): slow commands, answered within 90 s (D216)
                                     # 1.7 (G38): the editor block and the conflict code (D217)
                                     # 1.8 (G9): sensitive commands and settings, refused from paired devices (D221);
                                     # the view that sent a command, named to its space (D224)
                                     # 1.9 (G28): a space's file commands, the upload block, the upload's ticket,
                                     # and the welcome's view (D226)
                                     # 1.10: a category at the rail's foot (D248)
                                     # 1.11 (G43): a table's or a master list's filter bar (D250)
                                     # 1.12 (G44): the document block, a form's prose field, the report preview's
                                     # command (D251)
                                     # 1.13 (G45): a space's quick switches, and a page's live updates (D252)
                                     # 1.14 (G45): a space's scope and its scoped pages; tables and master lists read
                                     # a page at a time; a filter's own choices (D254)
                                     # 1.15: a header action that is a switch on a state topic's boolean (D256)
                                     # 1.16: a filter bar on a stream, a live feed or a log tail (D257)

[limits]
frame_from_page = 16384       # bytes of a frame from a page (§6.8)
frame_to_page = 262144        # bytes of a frame to a page: one state payload at most 256 KiB
commands_per_second = 20      # per connection
subscriptions = 32            # per connection
rows_per_batch = 100          # a stream batch
command_queue = 32            # each space's
upload_max = 33554432         # bytes of one uploaded file, 32 MiB (EST; §7.2 item 18, G28)
upload_ticket_seconds = 60    # an upload's ticket lives this long, and is used once
ping_seconds = 15             # liveness; two missed pongs close the socket
bad_messages_before_close = 3

[enums.error_code]
values = ["bad_message", "unknown_topic", "unknown_command", "unknown_key", "invalid_value", "locked", "not_now", "busy",
          "confirm_required", "unauthorised", "rate_limited", "version", "internal", "conflict"]  # conflict: 1.7 (D217), a save against a revision no longer the newest

[enums.bye_reason]
values = ["shutdown", "superseded", "unauthorised", "version", "fault"]

[enums.setting_type]
values = ["bool", "integer", "number", "duration_s", "choice", "tri_state", "key_name", "text", "secret"]

[enums.setting_effect]
values = ["now", "next_moment", "next_request", "next_launch"]

# A tri-state's third value (D163): auto (the space decides at the moment) or inherit (taken from a chain the space
# resolves, its value and source published in the settings body's `inherited`).
[enums.tri_third]
values = ["auto", "inherit"]

[enums.reset_scope_kind]
values = ["key", "page", "all"]

[enums.command_view]  # 1.8 (D224, §7.3): the in-game menu, a browser on this PC, or a paired device at home
values = ["game", "browser", "device"]

[enums.topic_shape]
values = ["state", "stream"]

# The components a page's block may draw (§2.5), versioned with the protocol's minor (§6.4): only GraceUI adds one.
# Settings rows, shortcut rows, sections, tabs, the header, help and the Related card are the page's own structure.
[enums.component]
values = ["stat_tiles", "filter_bar", "table", "master_detail", "card_grid", "segmented_switch", "statement",
          "journal", "transcript", "live_feed", "check_list", "log_tail", "report_preview", "computed_sentence",
          "action_button", "wizard_steps", "key_value_list"]

[enums.block_kind]
values = ["settings", "shortcuts", "component", "form", "editor", "upload", "document"]  # upload: 1.9 (D226);
                                                                                      # document: 1.12 (D251)

[enums.action_tone]
values = ["primary", "secondary", "destructive"]

[enums.sort_direction]
values = ["ascending", "descending"]  # 1.11 (G43, D250): a sort option's own direction

[enums.row_capture]
values = ["key", "chord"]

[enums.page_tag]
values = ["wip", "later"]

# ---- Shared types.

[types.settings_schema]
doc = "A space's settings schema: its number and a hash of its settings description (§6.4)"
fields = [
  { name = "number", type = "u32" },
  { name = "hash", type = "string", max = 64 },
]

[types.space_info]
doc = "A space this view may show (welcome)"
fields = [
  { name = "id", type = "id" },
  { name = "name", type = "string", max = 64 },
  { name = "version", type = "string", max = 32 },
  { name = "increment", type = "string", max = 64 },
  { name = "settings_schema", type = "type.settings_schema" },
]

[types.choice]
doc = "One choice of a choice setting, and the label players see"
fields = [
  { name = "value", type = "string", max = 64 },
  { name = "label", type = "string", max = 128 },
]

[types.setting]
doc = "One entry of a space's settings description (§6.9)"
fields = [
  { name = "key", type = "id" },
  { name = "type", type = "enum.setting_type" },
  { name = "default", type = "json", max = 1024 },
  { name = "min", type = "f64", optional = true },
  { name = "max", type = "f64", optional = true },
  { name = "step", type = "f64", optional = true },
  { name = "unit", type = "string", max = 16, optional = true },
  { name = "choices", type = "list.type.choice", max = 64, optional = true },
  { name = "choices_from", type = "id", optional = true },
  { name = "third", type = "enum.tri_third", optional = true },
  { name = "label", type = "string", max = 128 },
  { name = "help", type = "string", max = 1024 },
  { name = "synonyms", type = "list.string", max = 16, item_max = 64, optional = true },
  { name = "home", type = "id" },
  { name = "effect", type = "enum.setting_effect" },
  { name = "availability", type = "string", max = 128 },
  { name = "locked", type = "bool" },
  { name = "sensitive", type = "bool", optional = true },  # 1.8 (D221): set or reset from this PC alone, never a paired device
]

[types.inherited_value]
doc = "What an inherit tri-state resolves to now: on or off, the source in words, and the page that sets it"
fields = [
  { name = "key", type = "id" },
  { name = "on", type = "bool" },
  { name = "source", type = "string", max = 96 },
  { name = "page", type = "id", optional = true },
]

[types.settings_body]
doc = "The settings topic's body: the description, the values, the keys changed from their defaults, and what each inherit tri-state on inherit resolves to"
fields = [
  { name = "schema", type = "type.settings_schema" },
  { name = "description", type = "list.type.setting", max = 512 },
  { name = "values", type = "object", max = 65536 },
  { name = "changed", type = "list.id", max = 512 },
  { name = "inherited", type = "list.type.inherited_value", max = 512, optional = true },
]

# ---- Page descriptions (§2.5, D160): a space's rail, pages and topics, handed over at register_pages and shown by both
# views with GraceUI's components. tools/pages/build.py writes them from each space's TOML; its lint holds the rules.

[types.settings_description]
doc = "A space's settings description (§6.9): its schema and every setting it owns"
fields = [
  { name = "schema", type = "type.settings_schema" },
  { name = "settings", type = "list.type.setting", max = 512 },
]

[types.topic_info]
doc = "A topic a space publishes: its shape, and for a stream its ring's size; a family (1.5, D215), whose members <id>/<key> are state topics a view watches one by one"
fields = [
  { name = "id", type = "id" },
  { name = "shape", type = "enum.topic_shape" },
  { name = "ring", type = "u32", optional = true },
  { name = "family", type = "bool", optional = true },  # 1.5 (D215): its members are watched and published, never it
]

[types.page_action]
doc = "A header action: a command of the space's, with a confirmation for a destructive one; since 1.15 (D256) a header action may be a switch, its state a boolean member of a state topic of the space's, its command sent with {on}"
fields = [
  { name = "id", type = "id" },
  { name = "label", type = "string", max = 64 },
  { name = "command", type = "id" },
  { name = "tone", type = "enum.action_tone" },
  { name = "confirm", type = "string", max = 256, optional = true },
  { name = "state", type = "type.quick_state", optional = true },  # 1.15 (D256): a header switch
]

[types.row_action]
doc = "A button on each row of a table (D192): its command gets the row's key, a destructive one only after its confirmation; one that captures (D209) first takes a key or a pad chord from the player, sent as `value`, and a `confirm_required` answer with words is asked and sent again with `confirm`"
fields = [
  { name = "id", type = "id" },
  { name = "label", type = "string", max = 64 },
  { name = "command", type = "id" },
  { name = "key", type = "id" },
  { name = "tone", type = "enum.action_tone" },
  { name = "confirm", type = "string", max = 256, optional = true },
  { name = "capture", type = "enum.row_capture", optional = true },  # 1.4 (D209): the view captures first, sent as "value"
]

[types.row_secret]
doc = "A secret on each row of a table (D194): the column whose cells hold its status (set, or empty) and the command that sets it, write-only (invariant 5)"
fields = [
  { name = "column", type = "id" },
  { name = "command", type = "id" },
  { name = "key", type = "id" },
]

[types.form_field]
doc = "A text field of a form block (D195): its id in the command's args, its label, its most bytes"
fields = [
  { name = "id", type = "id" },
  { name = "label", type = "string", max = 64 },
  { name = "max", type = "u32" },
  { name = "prose", type = "bool", optional = true },  # 1.12 (D251): several lines, max up to 2000
]

[types.editor_block]
doc = "An editor block (1.7, D217): its document is its topic's body (a state topic, or a family's member on a master page); the commands it sends, each the space's own, and the draft's notes field"
fields = [
  { name = "save", type = "id" },
  { name = "check", type = "id", optional = true },
  { name = "reset", type = "id", optional = true },    # every field back to the space's own: asks first
  { name = "restore", type = "id", optional = true },  # the version saved before the last
  { name = "draft", type = "id", optional = true },    # a slow command (D216): a model's draft, shown beside the fields
  { name = "notes_label", type = "string", max = 64, optional = true },
  { name = "notes_max", type = "u32", optional = true },  # the notes' characters, 1 to 400
]

[types.topic_member]
doc = "A state topic of the space's, or one member of its body (1.14, D254)"
fields = [
  { name = "topic", type = "id" },
  { name = "field", type = "string", max = 32, optional = true },
]

[types.filter_option]
doc = "A filter of a filter bar (1.11, G43, D250): one of its table's columns, its choices the values the rows hold; on a table read a page at a time (1.14, D254), its own choices, or a state topic's list of them"
fields = [
  { name = "column", type = "id" },
  { name = "label", type = "string", max = 32 },
  { name = "choices", type = "list.type.choice", max = 32, optional = true },  # 1.14 (D254)
  { name = "choices_from", type = "type.topic_member", optional = true },     # 1.14 (D254)
]

[types.page_source]
doc = "Rows read a page at a time (1.14, D254): a command of the space's, sent with its args and the view's cursor, filters, sort, search and scope, which answers {columns, rows, next, total}; and a state topic whose change means new rows"
fields = [
  { name = "command", type = "id" },
  { name = "args", type = "object", max = 4096, optional = true },
  { name = "changes", type = "id", optional = true },
]

[types.space_scope]
doc = "A space's scope (1.14, D254): the top bar's chooser on its scoped pages (EldenNet's Journey), its label, and the state topic (or member) holding {choices: [{id, label, read_only}], current}"
fields = [
  { name = "label", type = "string", max = 32 },
  { name = "topic", type = "id" },
  { name = "field", type = "string", max = 32, optional = true },
]

[types.sort_option]
doc = "A sort option of a filter bar (1.11): a column, or a member of each row that is not shown; ascending unless it says"
fields = [
  { name = "key", type = "id" },
  { name = "label", type = "string", max = 32 },
  { name = "direction", type = "enum.sort_direction", optional = true },
]

[types.filter_search]
doc = "A filter bar's search (1.11): the columns it reads, never one holding chat or story text, and its field's label"
fields = [
  { name = "columns", type = "list.id", max = 4 },
  { name = "label", type = "string", max = 64 },
]

[types.filter_bar]
doc = "A table's or a master list's filter bar (1.11, G43, D250), done in the view on the rows published, never sent"
fields = [
  { name = "filters", type = "list.type.filter_option", max = 4, optional = true },
  { name = "sort", type = "list.type.sort_option", max = 4, optional = true },
  { name = "search", type = "type.filter_search", optional = true },
]

[types.page_block]
doc = "A block of a section: the rows of settings homed on this page, shortcut rows to settings homed elsewhere, a component bound to a topic (a table with its row actions and row secret), or a small form"
fields = [
  { name = "kind", type = "enum.block_kind" },
  { name = "keys", type = "list.id", max = 64, optional = true },
  { name = "component", type = "enum.component", optional = true },
  { name = "topic", type = "id", optional = true },
  { name = "props", type = "object", max = 4096, optional = true },
  { name = "row_actions", type = "list.type.row_action", max = 3, optional = true },
  { name = "row_secret", type = "type.row_secret", optional = true },
  { name = "command", type = "id", optional = true },
  { name = "fields", type = "list.type.form_field", max = 4, optional = true },
  { name = "submit", type = "string", max = 32, optional = true },
  { name = "editor", type = "type.editor_block", optional = true },  # 1.7 (D217)
  # 1.9 (D226): an upload block's file kinds, as the browser's picker takes them (".zip, .toml"); a hint, checked by the space
  { name = "accept", type = "string", max = 128, optional = true },
  { name = "filter_bar", type = "type.filter_bar", optional = true },  # 1.11 (D250): a table block's alone
  { name = "page", type = "type.page_source", optional = true },  # 1.14 (D254): a table's rows a page at a time
]

[types.section_status]
doc = "A section's live status (D202): a state topic of the space's, or a member of its body, holding {word, tone} in the lamp's tones"
fields = [
  { name = "topic", type = "id" },
  { name = "field", type = "string", max = 32, optional = true },
]

[types.quick_state]
doc = "A session switch's state (1.13, D252): a boolean at a member of a state topic of the space's"
fields = [
  { name = "topic", type = "id" },
  { name = "field", type = "string", max = 32 },
]

[types.quick_switch]
doc = "A quick switch (1.13, D252): a shortcut to a setting of the space's, a switch or a choice, by its key alone; or a session switch the space owns, which sends its command with {on} and shows the state the space publishes, named with the page it lives in"
fields = [
  { name = "key", type = "id", optional = true },
  { name = "id", type = "id", optional = true },
  { name = "label", type = "string", max = 64, optional = true },
  { name = "command", type = "id", optional = true },
  { name = "state", type = "type.quick_state", optional = true },
  { name = "home", type = "id", optional = true },
]

[types.page_section]
doc = "A section: a card with a label, an optional line, its blocks and an Advanced disclosure; a chip, a live status and actions of its own (D202)"
fields = [
  { name = "id", type = "id" },
  { name = "title", type = "string", max = 64 },
  { name = "description", type = "string", max = 256, optional = true },
  { name = "collapsed", type = "bool", optional = true },
  { name = "blocks", type = "list.type.page_block", max = 32 },
  { name = "advanced", type = "list.type.page_block", max = 16, optional = true },
  { name = "chip", type = "string", max = 24, optional = true },
  { name = "status", type = "type.section_status", optional = true },
  { name = "actions", type = "list.type.page_action", max = 2, optional = true },
]

[types.page_tab]
doc = "A tab of a page and its sections"
fields = [
  { name = "id", type = "id" },
  { name = "name", type = "string", max = 32 },
  { name = "sections", type = "list.type.page_section", max = 32 },
]

[types.page_help]
doc = "A page's help: what it is for, and how to use it in three to five steps (§4.2.4)"
fields = [
  { name = "purpose", type = "string", max = 512 },
  { name = "steps", type = "list.string", max = 5, item_max = 256 },
]

[types.page_master]
doc = "A page's master list (1.5, D215, D36): a table's state topic, the column of each row's key, and the family whose member that key names; the page's tabs and sections are its detail, and a block bound to the family draws the chosen row's member"
fields = [
  { name = "topic", type = "id", optional = true },  # optional since 1.14: a list read a page at a time has `page`
  { name = "key", type = "id" },
  { name = "detail", type = "id" },
  { name = "label", type = "string", max = 64 },             # the list's own name, read by screen readers and in game
  { name = "empty", type = "string", max = 160, optional = true },  # the list's words when it has no rows
  { name = "none", type = "string", max = 160, optional = true },   # the detail's words while no row is chosen
  { name = "filter_bar", type = "type.filter_bar", optional = true },  # 1.11 (D250)
  { name = "page", type = "type.page_source", optional = true },  # 1.14 (D254): its rows a page at a time
]

[types.page]
doc = "A page: its place, its header, its help, its Related links, and its tabs or its sections; a master list, its tabs and sections then its detail (1.5)"
fields = [
  { name = "id", type = "id" },
  { name = "category", type = "id" },
  { name = "name", type = "string", max = 64 },
  { name = "description", type = "string", max = 160 },
  { name = "help", type = "type.page_help" },
  { name = "related", type = "list.id", max = 8 },
  { name = "increment", type = "string", max = 16, optional = true },
  { name = "tag", type = "enum.page_tag", optional = true },
  { name = "actions", type = "list.type.page_action", max = 4, optional = true },
  { name = "tabs", type = "list.type.page_tab", max = 8, optional = true },
  { name = "sections", type = "list.type.page_section", max = 32, optional = true },
  { name = "master", type = "type.page_master", optional = true },  # 1.5 (D215)
  { name = "live", type = "bool", optional = true },  # 1.13 (D252): its topics move by themselves; Live updates holds them
  { name = "scoped", type = "bool", optional = true },  # 1.14 (D254): it follows the space's scope (EldenNet's Journey)
]

[types.category]
doc = "A category of the rail and its pages, in order; at the rail's foot, under a rule, if `foot` (1.10, D248)"
fields = [
  { name = "id", type = "id" },
  { name = "name", type = "string", max = 64 },
  { name = "pages", type = "list.id", max = 32 },
  { name = "foot", type = "bool", optional = true },  # 1.10 (D248): after every other category, as the lint requires
]

[types.space_pages]
doc = "A space's page data (§2.5): its rail, its pages, the topics and commands they use, and the protocol minor its components need"
fields = [
  { name = "space", type = "id" },
  { name = "name", type = "string", max = 64 },
  { name = "minor", type = "u32" },
  { name = "categories", type = "list.type.category", max = 16 },
  { name = "pages", type = "list.type.page", max = 128 },
  { name = "topics", type = "list.type.topic_info", max = 64 },
  { name = "commands", type = "list.id", max = 64 },
  { name = "slow_commands", type = "list.id", max = 8, optional = true },  # 1.6 (D216): answered within 90 s, not 10
  { name = "sensitive_commands", type = "list.id", max = 16, optional = true },  # 1.8 (D221): from this PC alone, never a paired device
  { name = "file_commands", type = "list.id", max = 4, optional = true },  # 1.9 (D226): each takes one file by the upload route; each sensitive too
  { name = "quick", type = "list.type.quick_switch", max = 12, optional = true },  # 1.13 (D252): the top bar's Quick switches
  { name = "scope", type = "type.space_scope", optional = true },  # 1.14 (D254): its scoped pages' chooser
]

# ---- Message kinds (§6.3). `from` is who sends it: page (a view: the browser or the in-game view), grace (GraceUI),
# space (a space, through GraceUI), or both. `space = true` means the frame carries its space's id.

[messages.hello]
from = "page"
space = false
doc = "The first frame: within 2 s of connecting (browser), when the in-game view starts (in game)"
fields = [
  { name = "protocol", type = "string", max = 16 },
  { name = "bundle", type = "string", max = 64 },
  { name = "caps", type = "list.id", max = 64 },
  { name = "ticket", type = "string", max = 128, optional = true },
]

[messages.welcome]
from = "grace"
space = false
doc = "The handshake accepted"
fields = [
  { name = "protocol", type = "string", max = 16 },
  { name = "caps", type = "list.id", max = 64 },
  { name = "graceui", type = "string", max = 32 },
  { name = "spaces", type = "list.type.space_info", max = 32 },
  { name = "session", type = "string", max = 64 },
  # 1.9 (D226): which view this is, from its channel: "browser" (this PC) or "device" (paired at home), for what it offers
  { name = "view", type = "enum.command_view", optional = true },
]

[messages.sub]
from = "page"
space = true
doc = "Watch a topic; for a stream, from a sequence number"
fields = [
  { name = "id", type = "u32" },
  { name = "topic", type = "id" },
  { name = "since", type = "u64", optional = true },
]

[messages.unsub]
from = "page"
space = true
doc = "Stop watching a topic"
fields = [
  { name = "id", type = "u32" },
  { name = "topic", type = "id" },
]

[messages.state]
from = "space"
space = true
doc = "A state topic's whole payload"
fields = [
  { name = "topic", type = "id" },
  { name = "rev", type = "u64" },
  { name = "body", type = "object", max = 262144 },
]

[messages.rows]
from = "space"
space = true
doc = "Stream rows, in order; a batch whose from_seq is past the view's next row starts the stream over there, so an empty one clears it (1.1)"
fields = [
  { name = "topic", type = "id" },
  { name = "from_seq", type = "u64" },
  { name = "rows", type = "list.object", max = 100, item_max = 16384 },
  { name = "dropped", type = "u64" },
]

[messages.cmd]
from = "page"
space = true
doc = "A command"
fields = [
  { name = "id", type = "u32" },
  { name = "name", type = "id" },
  { name = "args", type = "object", max = 16384 },
  # 1.8 (D224, §7.3): which view sent it, as GraceUI saw the channel; set for the space, and a view's own never kept
  { name = "view", type = "enum.command_view", optional = true },
]

[messages.upload]
from = "page"
space = true
doc = "Ask for an upload's one-use ticket (1.9, D226, §7.2 item 18): for a file command of the space's, its args, and the file's size in bytes and SHA-256 (64 lowercase hex); the command's result comes back as for a cmd with the same id"
fields = [
  { name = "id", type = "u32" },
  { name = "name", type = "id" },
  { name = "args", type = "object", max = 16384 },
  { name = "size", type = "u64" },
  { name = "sha256", type = "string", max = 64 },
]

[messages.upload_ticket]
from = "grace"
space = true
doc = "An upload's ticket (1.9, D226): sent with the file's bytes to POST /upload within 60 s, once, from this session alone"
fields = [
  { name = "id", type = "u32" },
  { name = "ticket", type = "string", max = 128 },
]

[messages.result]
from = "space"
space = true
doc = "The answer to one command: ok, or an error with its reason in words a player reads (detail, 1.1)"
fields = [
  { name = "id", type = "u32" },
  { name = "ok", type = "bool", optional = true },
  { name = "error", type = "enum.error_code", optional = true },
  { name = "body", type = "object", max = 262144, optional = true },
  { name = "detail", type = "string", max = 256, optional = true },
]

[messages.error]
from = "both"
space = "optional"
doc = "A protocol-level error not tied to a command"
fields = [
  { name = "code", type = "enum.error_code" },
  { name = "detail", type = "string", max = 256 },
]

[messages.bye]
from = "grace"
space = false
doc = "GraceUI is closing the connection"
fields = [
  { name = "reason", type = "enum.bye_reason" },
]

[messages.ping]
from = "both"
space = false
doc = "Liveness, every 15 s"
fields = []

[messages.pong]
from = "both"
space = false
doc = "The answer to a ping"
fields = []

# ---- The framework's commands (§6.6): the args each takes, checked before its space sees them.

[commands."settings.set"]
doc = "Set one setting: the key known, the value of its type and within its bounds, not locked (the space checks these)"
fields = [
  { name = "key", type = "id" },
  { name = "value", type = "json", max = 1024 },
]

[commands."settings.reset"]
doc = "Reset a key, a page or all of a space's settings; a page or all needs confirm"
fields = [
  { name = "scope", type = "enum.reset_scope_kind" },
  { name = "target", type = "id", optional = true },
  { name = "confirm", type = "bool", optional = true },
]

[commands."menu.close"]
doc = "Close the menu (in game only)"
fields = []

[commands."dashboard.disconnect"]
doc = "Renew the session cookie and close every connection (in game, or from the loopback listener)"
fields = []
