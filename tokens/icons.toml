# tokens/icons.toml: the Grace theme's line icons for the rail's categories (DESIGN §3.8, §3.15; D277). Our own
# geometry, drawn by both views from this one file (tools/tokens/build.py writes src/grace-tokens/include/grace/icons.h
# and web/src/icons.ts), so that they cannot drift: an 18-unit square, a 1.5-unit stroke, round ends and joins.
#
# Each icon is a list of strokes on the 18-unit grid, y downward:
#   lines = [[x0, y0, x1, y1, ...], ...]   a polyline through its points (two or more)
#   rings = [[cx, cy, r], ...]             a circle's outline
#   arcs  = [[cx, cy, r, from, to], ...]   part of one, in degrees: 0 at the right, clockwise on the display; drawn as
#                                          lines of at most 15 degrees each
# Every point stays within 1.5 and 16.5, so that the stroke falls inside the square. The names are protocol 1.22's
# `icon` values for a category (src/grace-protocol/protocol.toml's enums.icon), the same set in the same order. Generic
# marks of ours, none traced from a game's icons; the grace mark is GraceUI's own lozenge.

stroke = 1.5
size = 18

