lines = [[2.5, 9, 9, 2.5, 15.5, 9], [4.5, 7.5, 4.5, 15.5, 13.5, 15.5, 13.5, 7.5], [7.5, 15.5, 7.5, 11, 10.5, 11, 10.5, 15.5]]

